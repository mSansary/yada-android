name: Build YADA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Find and extract YADA project archive
        id: archive
        shell: bash
        run: |
          shopt -s nullglob
          archives=(YADA_Android_Project_v*.zip)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::error::No YADA project ZIP found in the repository root."
            echo "Upload a file named YADA_Android_Project_vX.zip to the repository root."
            exit 1
          fi

          ARCHIVE=$(printf '%s\n' "${archives[@]}" | sort -V | tail -n 1)
          echo "Using project archive: $ARCHIVE"
          echo "name=$ARCHIVE" >> "$GITHUB_OUTPUT"

          mkdir -p "$RUNNER_TEMP/yada-project"
          unzip -oq "$ARCHIVE" -d "$RUNNER_TEMP/yada-project"

      - name: Detect Gradle project directory
        id: project
        shell: bash
        run: |
          SETTINGS=$(find "$RUNNER_TEMP/yada-project" -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "::error::Gradle settings file not found inside the selected ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build YADA debug APK
        run: |
          gradle -p "${{ steps.project.outputs.dir }}" --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YADA-debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: OpenAI ChatGPT Action
        uses: cahaseler/openai-api@v1.0.0
